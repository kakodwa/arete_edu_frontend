
name: Generate Arete Edu Android Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate Arete Edu Android Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Arete Edu release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$STORE_PASSWORD" || (echo "Missing keystore password" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing key password" && exit 1)

          keytool -genkeypair \
            -v \
            -keystore arete-edu-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias arete_edu \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Arete Edu, OU=Mobile, O=Arete Edu, L=Mangochi, ST=Malawi, C=MW"

          echo "Arete Edu release keystore generated successfully."

      - name: Upload Arete Edu release keystore
        uses: actions/upload-artifact@v4
        with:
          name: arete-edu-release-keystore
          path: arete-edu-release.jks
          retention-days: 7
